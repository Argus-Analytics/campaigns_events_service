[project]
name = "campaigns_events_service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiokafka>=0.11.0",
    "slowapi>=0.1.9",
]

[tool.uv]
package = false
dev-dependencies = ["ruff>=0.6.9", "pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
# Mismo patrón que core_sms/billing_service: pythonpath reproduce el
# PYTHONPATH=/app/src del Dockerfile sin instalar el paquete.
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
