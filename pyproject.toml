[project]
name = "campaigns_events_service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiokafka>=0.11.0",
]

[tool.uv]
package = false
dev-dependencies = ["ruff>=0.6.9"]

[tool.ruff]
line-length = 120
target-version = "py311"
