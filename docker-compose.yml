services:
  # Redpanda de un solo nodo (dev-container) — reemplaza Apache Kafka porque
  # el resto de la infra ya corre Redpanda. Habla el protocolo Kafka, así que
  # aiokafka (producer.py/consumer_base.py) no necesita ningún cambio de código.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: campaigns-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Job de un solo uso: crea los topics de forma explícita (evita depender
  # de auto-creación con defaults poco predecibles). `|| true` por topic para
  # que sea idempotente en reruns de `docker compose up` (rpk falla si el
  # topic ya existe, a diferencia de --if-not-exists de kafka-topics.sh).
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create campaigns.pulpey --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.tigo.gt --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.claro.gt --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.tigo.hn --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.claro.hn --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.tigo.sv --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.claro.sv --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.tigo.ni --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.claro.ni --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.tigo.cr --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.claro.cr --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.delivery-status --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true
        rpk topic create campaigns.dead-letter --partitions 1 --replicas 1 -X brokers=redpanda:9092 || true

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: campaigns-redpanda-console
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # Único punto de entrada HTTP: core_sms le pega a esto para publicar
  # eventos, nunca toca un cliente Kafka directamente (ver README).
  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaigns_events_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes:
      - ./src:/app/src
    command:
      ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8302",
       "--reload", "--reload-dir", "/app/src"]
    ports:
      - "8302:8302"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8302/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-tigo-gt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaigns-worker-tigo-gt
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      PROVIDER: tigo_gt
    volumes:
      - ./src:/app/src
    command: ["uv", "run", "python", "-m", "workers.provider_worker"]
    depends_on:
      redpanda-init:
        condition: service_completed_successfully

  worker-claro-gt:
